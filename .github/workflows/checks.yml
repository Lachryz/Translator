name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (Python ${{ matrix.python }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      # All transport tests use mocks; never use real credentials in CI.
      DEEPSEEK_URL: https://example.invalid/v1
      DEEPSEEK_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python and shell syntax
        run: |
          ruff check .
          zsh -n run_quick_action.sh
      - name: Run offline tests
        # Tests requiring the private 2batch backend report explicit skips.
        run: python -m unittest discover -s tests -v
      - name: Build and sign native macOS helpers
        if: matrix.python == '3.13'
        run: python install_quick_action.py --build-only
