name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (Python ${{ matrix.python }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      # All transport tests use mocks; never use real credentials in CI.
      DEEPSEEK_URL: https://example.invalid/v1
      DEEPSEEK_KEY: test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10
      - name: Install development dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Check Python and shell syntax
        run: |
          uv run --locked ruff check .
          zsh -n run_quick_action.sh
      - name: Run offline tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build and sign native macOS helpers
        if: matrix.python == '3.13'
        run: uv run --locked python install_quick_action.py --build-only
